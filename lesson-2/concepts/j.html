<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>К · Ночная смена · слайд 4</title>
<style>
@font-face{font-family:Oranienbaum;src:url(../fonts/oranienbaum-cyr.woff2) format("woff2");font-display:block;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Oranienbaum;src:url(../fonts/oranienbaum-lat.woff2) format("woff2");font-display:block;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:Golos;src:url(../fonts/golos-cyr.woff2) format("woff2");font-weight:400 700;font-display:block;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:Golos;src:url(../fonts/golos-lat.woff2) format("woff2");font-weight:400 700;font-display:block;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"JB Mono";src:url(../fonts/jbmono-cyr.woff2) format("woff2");font-weight:400 600;font-display:block;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"JB Mono";src:url(../fonts/jbmono-lat.woff2) format("woff2");font-weight:400 600;font-display:block;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#04090A;--ink:#E9F1EE;--muted:#82938F;--teal:#88DECC;--sand:#E7CFAE;--glass:rgba(200,240,230,.045)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:Golos,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--k,1));overflow:hidden;background:var(--bg)}
.mono{font-family:"JB Mono",ui-monospace,monospace}

.scene{position:absolute;inset:0;perspective:1600px;perspective-origin:50% 30%}
.world{position:absolute;left:800px;top:560px;width:0;height:0;transform-style:preserve-3d}
.floor{position:absolute;left:0;top:150px;width:4000px;height:3000px;transform:translate(-50%,-50%) rotateX(90deg);
  background-image:linear-gradient(rgba(136,222,204,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(136,222,204,.07) 1px,transparent 1px);
  background-size:160px 160px;background-position:center;
  -webkit-mask-image:radial-gradient(closest-side,#000 30%,transparent 100%);mask-image:radial-gradient(closest-side,#000 30%,transparent 100%)}
.floor svg{position:absolute;inset:0;width:4000px;height:3000px;overflow:visible}
.rt-base{fill:none;stroke:rgba(136,222,204,.16);stroke-width:4}
.rt{fill:none;stroke:var(--teal);stroke-width:6;stroke-linecap:round}

.pnl{position:absolute;width:250px;height:280px;left:-125px;top:-160px;border-radius:24px;padding:22px;
  background:linear-gradient(180deg,rgba(200,240,230,.07),rgba(200,240,230,.025));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.12),0 40px 80px -40px rgba(0,0,0,.9)}
.pnl::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;
  background:linear-gradient(180deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.12) 22%,rgba(255,255,255,0) 45%,rgba(255,255,255,0) 60%,rgba(255,255,255,.12) 82%,rgba(255,255,255,.38) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.pnl .lit{position:absolute;inset:-1px;border-radius:25px;border:1.5px solid var(--teal);opacity:0}
.pnl h3{font-weight:600;font-size:26px;line-height:1.1;letter-spacing:-.01em}
.pnl .sub{font-size:18px;color:var(--muted);margin-top:6px}
.pnl .art{position:absolute;left:22px;right:22px;bottom:22px}
.bub{font-size:18px;line-height:1.25;padding:10px 12px;border-radius:14px}
.bub.me{background:var(--sand);color:#20170C;border-bottom-right-radius:4px}
.bub.bot{background:rgba(255,255,255,.07);border-bottom-left-radius:4px;margin-bottom:8px}
.log{font-size:18px;line-height:1.55;color:#BFD0CB;white-space:pre}
.log i{font-style:normal;color:var(--teal)}
.chip{display:inline-flex;align-items:center;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--teal);color:var(--teal);font-size:18px}
.chip .t{display:inline-block;overflow:hidden;white-space:nowrap}
.q{font-family:Oranienbaum,serif;font-size:32px;line-height:1.05}
.files{font-size:18px;line-height:1.7;color:#BFD0CB}
.base{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--bg);border:3px solid rgba(136,222,204,.35)}

.fog{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,var(--bg) 0%,rgba(4,9,10,.85) 26%,rgba(4,9,10,0) 46%,rgba(4,9,10,0) 82%,rgba(4,9,10,.9) 100%)}
h1{position:absolute;left:96px;top:70px;font-family:Oranienbaum,serif;font-weight:400;font-size:104px;line-height:.98;letter-spacing:-.01em}
h1 .ln{display:block;overflow:hidden;padding-bottom:.08em}
h1 .ln span{display:block}
.facts{position:absolute;left:96px;right:96px;bottom:56px;display:flex;gap:48px;font-size:20px;color:var(--muted)}
.facts b{color:var(--teal);font-weight:600}
.num{position:absolute;right:96px;top:96px;font-size:18px;color:var(--muted)}
.rot{position:absolute;inset:0;display:none;place-items:center;background:var(--bg);font-size:20px;z-index:9}
@media (orientation:portrait) and (max-width:700px){.rot{display:grid}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="scene">
    <div class="world" id="world">
      <div class="floor"><svg viewBox="0 0 4000 3000" aria-hidden="true">
        <path class="rt-base" id="rtb" d=""/>
        <path class="rt" id="rt" d=""/>
      </svg></div>
    </div>
  </div>
  <div class="fog"></div>
  <h1><span class="ln"><span>Как устроен</span></span><span class="ln"><span>помощник ТЗ</span></span></h1>
  <div class="num mono">04 / 24</div>
  <div class="facts" id="facts">
    <span><b class="mono">187</b> обращений к моделям за неделю</span>
    <span><b class="mono">3,85 $</b> на восемь человек</span>
    <span>имена и Telegram ID к модели не уходят</span>
  </div>
  <div class="rot">Поверните телефон</div>
</div>

<template id="panels">
  <div class="pnl"><div class="lit"></div><h3>Вы и телефон</h3><div class="sub">Telegram</div>
    <div class="art"><div class="bub bot">Шаг 1 из 8. Задача в двух словах.</div><div class="bub me">Сравнить два варианта паркинга</div></div></div>
  <div class="pnl"><div class="lit"></div><h3>Бот на моём ПК</h3><div class="sub">Python, 8 шагов</div>
    <div class="art log mono">память  SQLite
сторож  <i>в работе</i>
шаг     <i>3/8</i></div></div>
  <div class="pnl"><div class="lit"></div><h3>OpenRouter</h3><div class="sub">одна дверь ко многим моделям</div>
    <div class="art"><span class="chip mono"><span class="t" id="keyt">ключ API</span></span><div class="sub" style="margin-top:12px">обучение на данных: нет</div></div></div>
  <div class="pnl"><div class="lit"></div><h3>Модель</h3><div class="sub">спрашивает дальше</div>
    <div class="art q">«Кто будет смотреть результат?»</div></div>
  <div class="pnl"><div class="lit"></div><h3>Пакет</h3><div class="sub">обратно в Telegram</div>
    <div class="art files mono">ТЗ.docx<br>Правила.md<br>Как запустить<br>Образец.xlsx</div></div>
</template>

<script>
const stage=document.getElementById('stage');
function fit(){stage.style.setProperty('--k',Math.min(innerWidth/1600,innerHeight/900))}
addEventListener('resize',fit);fit();
const Q=new URLSearchParams(location.search),T=Q.has('t')?parseFloat(Q.get('t')):null;
const EXPO='cubic-bezier(.16,1,.3,1)',INOUT='cubic-bezier(.45,.05,.55,.95)';
const A=(el,kf,o)=>el.animate(kf,Object.assign({fill:'both',easing:EXPO},o));

// world coordinates of the five stops (x, z); floor y = 150
const STOPS=[[-600,110],[-300,-10],[0,50],[300,-30],[600,30]];
const world=document.getElementById('world');
const tpl=document.getElementById('panels').content.children;
const panels=[];
STOPS.forEach(([x,z],i)=>{
  const p=tpl[i].cloneNode(true);
  p.style.transform=`translate3d(${x}px,0,${z}px)`;
  world.appendChild(p);panels.push(p);
});
// route on the floor: floor local (fx,fy) = (x+2000, z+1500)
const F=([x,z])=>[x+2000,z+1500];
const pts=[[-1700,-700],[-1100,260],...STOPS,[1100,260],[1700,-700]].map(F);
let d=`M${pts[0]}`;
for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i],mx=(x0+x1)/2;d+=` C${mx},${y0} ${mx},${y1} ${x1},${y1}`}
document.getElementById('rt').setAttribute('d',d);
document.getElementById('rtb').setAttribute('d',d);

// overview camera and the close-up we fly in from
const CAM_END='rotateX(-9deg) rotateY(-11deg) translate3d(-40px,0,-60px)';
const CAM_START='rotateX(-8deg) rotateY(-34deg) translate3d(560px,0,520px)';

document.fonts.ready.then(()=>{
  document.querySelectorAll('h1 .ln span').forEach((s,i)=>A(s,[{transform:'translateY(115%)'},{transform:'none'}],{duration:1050,delay:200+i*90}));
  A(world,[{transform:CAM_START},{transform:CAM_END}],{duration:3200,delay:200,easing:INOUT});
  const rt=document.getElementById('rt'),L=rt.getTotalLength();
  rt.style.strokeDasharray=L;
  A(rt,[{strokeDashoffset:L},{strokeDashoffset:L*0.16}],{duration:3000,delay:300,easing:INOUT});
  panels.forEach((p,i)=>{
    const dl=500+i*480;
    A(p,[{opacity:0},{opacity:1}],{duration:700,delay:dl});
    A(p.querySelector('.lit'),[{opacity:0},{opacity:.9},{opacity:.28}],{duration:1400,delay:dl+150,easing:'ease-out'});
  });
  A(document.getElementById('keyt'),[{maxWidth:'0ch'},{maxWidth:'8ch'}],{duration:640,delay:500+2*480+250,easing:'steps(8,end)'});
  A(document.getElementById('facts'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:800,delay:3200});
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(T!==null||reduce){document.getAnimations().forEach(a=>{a.pause();a.currentTime=reduce?99999:T*1000})}
  document.documentElement.dataset.ready=1;
});
</script>
</body>
</html>
